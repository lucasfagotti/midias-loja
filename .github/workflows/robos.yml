# Roda os dois robôs na nuvem do GitHub a cada ~5 min (o GitHub pode atrasar alguns minutos).
# Segredos (Settings > Secrets > Actions): IG_USER_ID, IG_ACCESS_TOKEN, PUBLIC_BASE_URL
name: Robos
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: robos
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: America/Sao_Paulo   # horários do calendário são de Brasília
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Postagem
        run: python bot.py
        continue-on-error: true
      - name: Comentarios
        run: python comentarios.py
        continue-on-error: true
      - name: Estatisticas do perfil
        run: python estatisticas.py
        continue-on-error: true
      - name: Salvar o que foi feito
        run: |
          git config user.name "robo-loja"
          git config user.email "robo-loja@users.noreply.github.com"
          for f in publicados.json respondidos.json estatisticas.json; do [ -f "$f" ] && git add "$f"; done
          if ! git diff --cached --quiet; then
            git commit -m "estado dos robos"
            git pull --rebase && git push
          fi
